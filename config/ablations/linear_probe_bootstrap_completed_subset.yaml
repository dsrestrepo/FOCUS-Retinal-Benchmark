# CPU-only analysis grid for the bootstrap predictions completed before the
# full 16-model/19-evaluation experiment was launched.
models:
  - id: "facebook/dinov3-vitl16-pretrain-lvd1689m"
    family: "vm"
    domain: "general"
    display_name: "DINOv3"
  - id: "VisionFM-Fundus"
    family: "vm"
    domain: "ophthalmic"
    display_name: "VisionFM"
  - id: "google/siglip2-base-patch16-224"
    family: "vlm"
    domain: "general"
    display_name: "SigLIP2"
  - id: "RET-CLIP"
    family: "vlm"
    domain: "ophthalmic"
    display_name: "RET-CLIP"

evaluations:
  - dataset: "brset"
    task: "binary_dr"
  - dataset: "papila"
    task: "glaucoma"
  - dataset: "rfmid"
    task: "referable_dr"

n_train_bootstraps: 10
# Used for both the class-stratified resample and the explicit random L-BFGS
# starting point supplied by the subset run job.
base_seed: 3199
n_test_bootstraps: 2000
