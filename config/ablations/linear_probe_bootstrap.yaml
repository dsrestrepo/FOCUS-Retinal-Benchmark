# Rebuttal-only bootstrap analysis of linear-probe variability.
#
# All VM and VLM backbones evaluated with linear probing in the paper.
models:
  # General VMs
  - id: "google/vit-large-patch16-224"
    family: "vm"
    domain: "general"
    display_name: "ViT-L/16"
  - id: "facebook/dinov2-large"
    family: "vm"
    domain: "general"
    display_name: "DINOv2"
  - id: "facebook/dinov3-vitl16-pretrain-lvd1689m"
    family: "vm"
    domain: "general"
    display_name: "DINOv3"

  # Ophthalmic VMs
  - id: "YukunZhou/RETFound_mae_natureCFP"
    family: "vm"
    domain: "ophthalmic"
    display_name: "RETFound-CFP"
  - id: "YukunZhou/RETFound_mae_natureOCT"
    family: "vm"
    domain: "ophthalmic"
    display_name: "RETFound-OCT"
  - id: "YukunZhou/RETFound_mae_meh"
    family: "vm"
    domain: "ophthalmic"
    display_name: "RETFound-MEH"
  - id: "YukunZhou/RETFound_mae_shanghai"
    family: "vm"
    domain: "ophthalmic"
    display_name: "RETFound-Shanghai"
  - id: "YukunZhou/RETFound_dinov2_meh"
    family: "vm"
    domain: "ophthalmic"
    display_name: "RETFound-DINOv2-MEH"
  - id: "YukunZhou/RETFound_dinov2_shanghai"
    family: "vm"
    domain: "ophthalmic"
    display_name: "RETFound-DINOv2-Shanghai"
  - id: "VisionFM-Fundus"
    family: "vm"
    domain: "ophthalmic"
    display_name: "VisionFM"

  # General VLMs
  - id: "google/medsiglip-448"
    family: "vlm"
    domain: "general"
    display_name: "MedSigLIP"
  - id: "google/siglip2-base-patch16-224"
    family: "vlm"
    domain: "general"
    display_name: "SigLIP2"
  - id: "openai/clip-vit-base-patch32"
    family: "vlm"
    domain: "general"
    display_name: "CLIP"

  # Ophthalmic VLMs
  - id: "EyeCLIP"
    family: "vlm"
    domain: "ophthalmic"
    display_name: "EyeCLIP"
  - id: "RET-CLIP"
    family: "vlm"
    domain: "ophthalmic"
    display_name: "RET-CLIP"
  - id: "FLAIR"
    family: "vlm"
    domain: "ophthalmic"
    display_name: "FLAIR"

evaluations:
  - dataset: "brset"
    task: "binary_dr"
  - dataset: "brset"
    task: "referable_dr"
  - dataset: "brset"
    task: "glaucoma"
  - dataset: "mbrset"
    task: "binary_dr"
  - dataset: "mbrset"
    task: "referable_dr"
  - dataset: "mbrset"
    task: "glaucoma"
  - dataset: "papila"
    task: "glaucoma"
  - dataset: "rfmid"
    task: "binary_dr"
  - dataset: "rfmid"
    task: "referable_dr"
  - dataset: "rfmid_2"
    task: "binary_dr"
  - dataset: "rfmid_2"
    task: "referable_dr"
  - dataset: "idrid"
    task: "binary_dr"
  - dataset: "idrid"
    task: "referable_dr"
  - dataset: "messidor_2"
    task: "binary_dr"
  - dataset: "messidor_2"
    task: "referable_dr"
  - dataset: "refuge"
    task: "glaucoma"
  - dataset: "g1020"
    task: "glaucoma"
  - dataset: "jsiec1000"
    task: "binary_dr"
  - dataset: "jsiec1000"
    task: "referable_dr"

split_train: "train"
split_test: "test"
pooling: "cls"
batch_size: 16

# Each seed fits the same paper logistic-regression probe to a different
# class-stratified bootstrap sample and a different explicit random L-BFGS
# starting point. The run jobs invoke the rebuttal-only initialization wrapper.
n_train_bootstraps: 10
base_seed: 3199

# CPU-only paired test bootstrap used for confidence intervals and tests.
n_test_bootstraps: 2000
