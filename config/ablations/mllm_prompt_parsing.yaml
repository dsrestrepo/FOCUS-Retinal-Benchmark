# Rebuttal-only MLLM prompt/parsing sensitivity grid.
#
# The paper's `base` prompt is intentionally not rerun. The parsing job reads
# those predictions from OUTPUT_DIR and combines them with the two ablation
# variants below.
models:
  - "google/gemma-3-27b-it"
  - "google/medgemma-4b-it"
  - "google/medgemma-1.5-4b-it"
  - "llava-hf/llama3-llava-next-8b-hf"
  - "Qwen/Qwen3-VL-8B-Instruct"
  - "google/medgemma-27b-it"

prompt_variants:
  - "role"
  - "instruction_first"

datasets:
  - "brset"
  - "mbrset"
  - "papila"
  - "rfmid"
  - "rfmid_2"
  - "idrid"
  - "messidor_2"
  - "refuge"
  - "g1020"
  - "jsiec1000"

tasks:
  - "binary_dr"
  - "referable_dr"
  - "glaucoma"

dataset_tasks:
  brset: ["binary_dr", "referable_dr", "glaucoma"]
  mbrset: ["binary_dr", "referable_dr", "glaucoma"]
  papila: ["glaucoma"]
  rfmid: ["binary_dr", "referable_dr"]
  rfmid_2: ["binary_dr", "referable_dr"]
  idrid: ["binary_dr", "referable_dr"]
  messidor_2: ["binary_dr", "referable_dr"]
  refuge: ["glaucoma"]
  g1020: ["glaucoma"]
  jsiec1000: ["binary_dr", "referable_dr"]

quantization: "8b"
batch_size: 16
max_new_tokens: 128
split: "test"

# Each response protocol has two distinct components:
# 1. `text_parser` converts generated text to a hard label for accuracy.
# 2. `score` extracts a continuous score for AUROC/AUPRC/calibration.
#
# Binary renormalization is a score-extraction ablation, not a text parser.
response_protocols:
  regex_binary_normalized:
    text_parser: "first_label"
    score: "binary_renorm"
  regex_raw_yes:
    text_parser: "first_label"
    score: "raw_yes"
  strict_regex_binary:
    text_parser: "strict_label"
    score: "binary_renorm"
  first_token_binary:
    text_parser: "first_token_argmax"
    score: "binary_renorm"
